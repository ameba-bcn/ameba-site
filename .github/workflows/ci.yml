name: CI

on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # npm, no yarn: el hoisting de yarn 1 deixa vitest sense
      # @testing-library/dom i els tests no arrenquen.
      # package-lock.json no està versionat, per això `install` i no `ci`.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # Mateix gestor que el Dockerfile: valida el yarn.lock que toquen
      # les PRs de Dependabot.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
